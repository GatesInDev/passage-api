name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Mesma infraestrutura do compose.yaml: o ApiApplicationTests sobe a aplicação inteira.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: passage_db
          POSTGRES_USER: passage_user
          POSTGRES_PASSWORD: passage_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U passage_user -d passage_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: passage_db
      DB_USER: passage_user
      DB_PASS: passage_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      API_SECURITY_TOKEN_SECRET: ci-test-secret

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: ./mvnw -B -ntp test

      - name: Resumo dos testes
        if: always()
        run: |
          echo "### Resultado dos testes" >> "$GITHUB_STEP_SUMMARY"
          if ls target/surefire-reports/*.txt > /dev/null 2>&1; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -h "Tests run" target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum relatório gerado: a falha aconteceu antes dos testes rodarem." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
